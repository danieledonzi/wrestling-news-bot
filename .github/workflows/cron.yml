name: OpenWrestlingTV Bot v90.2.1

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  BOT_ARTIFACT_PATHS: |
    published/
    published_html_review/
    logs/
    pending_articles.json
    history.txt
    history.json
    confirmed_published_reports.json
    review_bundle_latest.zip
    soft_pool.json
    v90_2_event_cores.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply v90.0.1 inline image normalization hotfix
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')
          marker = '_v901_normalize_media_url'
          needle = '    inline_images = dedupe_preserve_order([u for u in inline_images if u])\n'
          replacement_lines = [
              '    def _v901_normalize_media_url(value):',
              '        if isinstance(value, str):',
              '            return value.strip()',
              '        if isinstance(value, dict):',
              '            for key in ("url", "src", "source_url", "image_url", "href"):',
              '                candidate = value.get(key)',
              '                if isinstance(candidate, str) and candidate.strip():',
              '                    return candidate.strip()',
              '            nested = value.get("image") or value.get("media")',
              '            if isinstance(nested, dict):',
              '                for key in ("url", "src", "source_url", "image_url", "href"):',
              '                    candidate = nested.get(key)',
              '                    if isinstance(candidate, str) and candidate.strip():',
              '                        return candidate.strip()',
              '        return ""',
              '',
              '    inline_images = dedupe_preserve_order([',
              '        _v901_normalize_media_url(u)',
              '        for u in inline_images',
              '        if _v901_normalize_media_url(u)',
              '    ])',
          ]
          replacement = '\n'.join(replacement_lines) + '\n'
          if marker in text:
              print('[HOTFIX v90.0.1] Inline image normalization already present')
          elif needle not in text:
              raise SystemExit('[HOTFIX v90.0.1] Target line not found')
          else:
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
              print('[HOTFIX v90.0.1] Inline image dict normalization applied')
          PY

      - name: Apply v90.2.1 patches
        run: |
          set -e
          python scripts/apply_bot_patch_v90_1.py
          python scripts/apply_bot_patch_v90_1_review_fix.py
          python scripts/apply_bot_patch_v90_1_1.py
          python scripts/apply_bot_patch_v90_1_2.py
          python scripts/apply_bot_patch_v90_1_3.py
          python scripts/apply_bot_patch_v90_2.py
          python scripts/apply_bot_patch_v90_2_1.py

      - name: Verify consolidated source
        run: |
          set -e
          python -m py_compile bot.py
          python - <<'PY'
          from pathlib import Path
          text = Path('bot.py').read_text(encoding='utf-8')
          required = [
              'v88.2: editorial performance guards',
              'v90.1.3: spoiler hotfix',
              'v90.2: editorial pacing and update gate',
              'v90.2.1: report dedupe protection',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('[SOURCE CONSOLIDATION v90.2.1] missing markers: ' + ', '.join(missing))
          print('[SOURCE CONSOLIDATION v90.2.1] bot.py contiene la chain consolidata fino a v90.2.1')
          PY

      - name: Run bot v90_2_1
        id: run_bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_URL: ${{ secrets.WP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-2.5-flash-lite,gemini-2.5-flash
          V90_2_ENABLED: "1"
          V90_2_UPDATE_GATE_ENABLED: "1"
          V90_2_SOFT_POOL_ENABLED: "1"
          V90_2_PACING_ENABLED: "1"
          V90_2_1_ENABLED: "1"
        run: |
          set +e
          python bot.py
          status=$?
          echo "$status" > .bot_exit_code
          exit 0
