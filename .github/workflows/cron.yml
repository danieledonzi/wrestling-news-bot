name: News Bot Cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 google-genai

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
        run: python bot.py

      - name: Debug bot state
        if: always()
        run: |
          echo "PWD:"
          pwd

          echo "FILES:"
          ls -la

          echo "GIT STATUS:"
          git status --short

          echo "HISTORY TAIL:"
          tail -n 20 history.txt || echo "history.txt non trovato"

          echo "LOGS:"
          ls -la logs || echo "logs non trovata"

      - name: Upload master log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-log
          path: logs/master_log.log
          if-no-files-found: warn

      - name: Save bot state and logs
        if: always()
        run: |
          git config --global user.name "News Bot"
          git config --global user.email "bot@wrestlingnews.com"

          echo "STATUS BEFORE ADD:"
          git status --short

          git add history.txt pending_articles.json failed_articles.json 2>/dev/null || true
          git add -f logs/master_log.log logs/master_log_state.json 2>/dev/null || true

          echo "STATUS AFTER ADD:"
          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "Update bot state and logs [skip ci]"
            git push origin main
          else
            echo "Nessuna modifica da salvare"
          fi
