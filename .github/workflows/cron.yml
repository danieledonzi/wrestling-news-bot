name: OpenWrestlingTV Bot v92

on:
  workflow_dispatch:
    inputs:
      manual_url:
        description: "URL da lavorare manualmente. Se vuoto, parte la pipeline schedulata."
        required: false
        default: ""
      manual_kind:
        description: "Tipo contenuto manuale: report o news"
        required: false
        default: "report"
      manual_title:
        description: "Titolo manuale opzionale. Per report lasciare vuoto se si vuole usare il titolo fonte."
        required: false
        default: ""
      manual_categories:
        description: "Categorie separate da virgola, es. Editoriali,WWE"
        required: false
        default: "Editoriali"
      manual_html_path:
        description: "Percorso repo opzionale di un HTML grezzo salvato dal browser, es. manual_inputs/ringside_raw.html"
        required: false
        default: ""
  # schedule:
  # - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: owtv-newsroom
  cancel-in-progress: false

env:
  USE_NEWSROOM_RUNNER: "1"
  BOT_ARTIFACT_PATHS: |
    logs/
    state/
    published/
    published_html_review/
    artifacts/newsroom/
    review_bundle_latest.zip
    .bot_exit_code

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply v92 report workshop
        run: |
          set -e
          python scripts/apply_v92_report_workshop.py

      - name: Verify v92/v93 source
        run: |
          set -e
          python -m json.tool config/reports_v92.json >/dev/null
          python -m json.tool config/feeds_v92.json >/dev/null
          python -m json.tool config/categories_v92.json >/dev/null
          python -m py_compile bot_v92.py
          python -m py_compile manual_v92.py
          python -m py_compile newsroom_runner.py
          python -m py_compile modules/report_workshop_v92.py
          python - <<'PY'
          from pathlib import Path
          text = Path('bot_v92.py').read_text(encoding='utf-8')
          manual = Path('manual_v92.py').read_text(encoding='utf-8')
          newsroom = Path('newsroom_runner.py').read_text(encoding='utf-8')
          required = [
              'v92_0_2_report_workshop_publish',
              'run_report_pipeline',
              'run_news_pipeline',
              'build_report_title',
              'expected_day_after',
              'entry_mentions_report_date',
              'run_report_workshop',
              'MAX_REPORTS_PER_RUN',
              'MAX_NEWS_PER_RUN',
          ]
          manual_required = ['V92_MANUAL_URL', 'V92_MANUAL_KIND', 'run_manual_report', 'V92_MANUAL_HTML_PATH']
          newsroom_required = ['v93_0_virtual_newsroom_bootstrap', 'NEWSROOM_ENGINE', 'subprocess', 'runtime_delegations']
          missing = [m for m in required if m not in text] + [m for m in manual_required if m not in manual] + [m for m in newsroom_required if m not in newsroom]
          if missing:
              raise SystemExit('[V92/V93 VERIFY] missing markers: ' + ', '.join(missing))
          print('[V92/V93 VERIFY] sources ok')
          PY

      - name: Reset v92 report status for testing
        if: ${{ github.event.inputs.manual_url == '' }}
        env:
          V92_FORCE_REPORT_REPUBLISH: "1"
          V92_FORCE_REPORT_ID: "wwe_raw"
          V92_FORCE_REPORT_OFFSET_DAYS: "1"
        run: |
          set -e
          python scripts/reset_v92_report_status_for_test.py

      - name: Run manual v92
        if: ${{ github.event.inputs.manual_url != '' }}
        id: run_manual
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_URL: ${{ secrets.WP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-2.5-flash-lite,gemini-2.5-flash
          GEMINI_REPORT_MODEL_CHAIN: gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite
          V92_MANUAL_URL: ${{ github.event.inputs.manual_url }}
          V92_MANUAL_KIND: ${{ github.event.inputs.manual_kind }}
          V92_MANUAL_TITLE: ${{ github.event.inputs.manual_title }}
          V92_MANUAL_CATEGORIES: ${{ github.event.inputs.manual_categories }}
          V92_MANUAL_HTML_PATH: ${{ github.event.inputs.manual_html_path }}
        run: |
          set +e
          python manual_v92.py
          status=$?
          echo "$status" > .bot_exit_code
          exit 0

      - name: Run scheduled v93 newsroom or v92 bot
        if: ${{ github.event.inputs.manual_url == '' }}
        id: run_bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_URL: ${{ secrets.WP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-2.5-flash-lite,gemini-2.5-flash
          GEMINI_REPORT_MODEL_CHAIN: gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite
          V92_MAX_REPORTS_PER_RUN: "1"
          V92_MAX_NEWS_PER_RUN: "3"
        run: |
          set +e
          if [ "${USE_NEWSROOM_RUNNER}" = "1" ]; then
            python newsroom_runner.py
          else
            python bot_v92.py
          fi
          status=$?
          echo "$status" > .bot_exit_code
          exit 0

      - name: Snapshot per-run artifacts
        if: always()
        run: |
          set -e
          RUN_DIR="artifacts/newsroom_runs/${GITHUB_RUN_ID}"
          mkdir -p "$RUN_DIR"
          cp -a artifacts/newsroom/. "$RUN_DIR/" 2>/dev/null || true
          cp -a state/newsroom "$RUN_DIR/state_newsroom" 2>/dev/null || true
          cp -a published_html_review "$RUN_DIR/published_html_review" 2>/dev/null || true
          cp -a published "$RUN_DIR/published" 2>/dev/null || true
          if [ -f logs/newsroom_master.log ]; then
            cp logs/newsroom_master.log "$RUN_DIR/newsroom_master.log"
          fi
          if [ -f .bot_exit_code ]; then
            cp .bot_exit_code "$RUN_DIR/.bot_exit_code"
          fi
          find artifacts/newsroom_runs -mindepth 1 -maxdepth 1 -type d | sort | head -n -40 | xargs -r rm -rf
          echo "[V93 ARTIFACTS] snapshot saved to $RUN_DIR"

      - name: Persist v92 runtime files
        if: always()
        run: |
          set -e
          git add -f logs/ state/ published/ published_html_review/ artifacts/newsroom_runs/ .bot_exit_code || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(v92): persist runtime state"
            git pull --rebase || echo "[v92] Warning: pull --rebase non riuscito, provo push diretto"
            git push || echo "[v92] Warning: push persistenza fallito"
          else
            echo "[v92] Nessun runtime file da persistere"
          fi

      - name: Upload bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owtv-v92-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/
            state/
            published/
            published_html_review/
            artifacts/newsroom/
            artifacts/newsroom_runs/${{ github.run_id }}/
            review_bundle_latest.zip
            .bot_exit_code

      - name: Fail job if bot failed
        if: always()
        run: |
          code=0
          if [ -f .bot_exit_code ]; then
            code=$(cat .bot_exit_code)
          fi
          if [ "$code" != "0" ]; then
            echo "[BOT v92/v93] Bot terminato con exit code $code"
            exit "$code"
          fi
