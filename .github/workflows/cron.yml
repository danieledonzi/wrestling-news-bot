name: OpenWrestlingTV Bot v90.1.1

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  BOT_ARTIFACT_PATHS: |
    published/
    published_html_review/
    logs/
    pending_articles.json
    history.txt
    history.json
    confirmed_published_reports.json
    review_bundle_latest.zip

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply v90.0.1 inline image normalization hotfix
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')
          marker = '_v901_normalize_media_url'
          needle = '    inline_images = dedupe_preserve_order([u for u in inline_images if u])\n'
          replacement_lines = [
              '    def _v901_normalize_media_url(value):',
              '        if isinstance(value, str):',
              '            return value.strip()',
              '        if isinstance(value, dict):',
              '            for key in ("url", "src", "source_url", "image_url", "href"):',
              '                candidate = value.get(key)',
              '                if isinstance(candidate, str) and candidate.strip():',
              '                    return candidate.strip()',
              '            nested = value.get("image") or value.get("media")',
              '            if isinstance(nested, dict):',
              '                for key in ("url", "src", "source_url", "image_url", "href"):',
              '                    candidate = nested.get(key)',
              '                    if isinstance(candidate, str) and candidate.strip():',
              '                        return candidate.strip()',
              '        return ""',
              '',
              '    inline_images = dedupe_preserve_order([',
              '        _v901_normalize_media_url(u)',
              '        for u in inline_images',
              '        if _v901_normalize_media_url(u)',
              '    ])',
          ]
          replacement = '\n'.join(replacement_lines) + '\n'
          if marker in text:
              print('[HOTFIX v90.0.1] Inline image normalization already present')
          elif needle not in text:
              raise SystemExit('[HOTFIX v90.0.1] Target line not found')
          else:
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
              print('[HOTFIX v90.0.1] Inline image dict normalization applied')
          PY

      - name: Apply v90.1.1 quality correctness patches
        run: |
          set -e
          python scripts/apply_bot_patch_v90_1.py
          python scripts/apply_bot_patch_v90_1_review_fix.py
          python scripts/apply_bot_patch_v90_1_1.py

      - name: Verify consolidated source
        run: |
          set -e
          python -m py_compile bot.py
          python - <<'PY'
          from pathlib import Path
          text = Path('bot.py').read_text(encoding='utf-8')
          required = [
              'v88.2: editorial performance guards',
              'v88.3',
              'v88.4',
              'v89',
              'v89.1: legacy return/debut rumor guard',
              'v90.1: quality correctness guards',
              'v90.1.1: media duplicate and spoiler fixes',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('[SOURCE CONSOLIDATION v90.1.1] missing markers: ' + ', '.join(missing))
          print('[SOURCE CONSOLIDATION v90.1.1] bot.py contiene la chain consolidata fino a v90.1.1')
          PY

      - name: Print runner public IP
        run: |
          echo "[NET] GitHub Actions public IP:"
          curl -s https://api.ipify.org || true
          echo

      - name: Run bot v90_1_1
        id: run_bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_URL: ${{ secrets.WP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-2.5-flash-lite,gemini-2.5-flash
          V877_ENABLE_GEMINI_3_FLASH_PREVIEW: "1"
          V877_GEMINI_3_FLASH_MODEL: gemini-3-flash-preview
          V877_FATAL_AUTH_ENABLED: "1"
          V877_REPORT_CONFIRM_CLEANUP_ENABLED: "1"
          V88_MEDIA_RECOVERY_ENABLED: "1"
          V88_FORCE_POSITIONAL_EMBEDS_ENABLED: "1"
          V88_RECOVER_INLINE_IMAGES_ENABLED: "1"
          V88_WORKFLOW_SAFE_FILENAMES_ENABLED: "1"
          V88_1_REPORT_DEDUPE_CONFIRM_ENABLED: "1"
          V88_2_EDITORIAL_PERFORMANCE_GUARDS_ENABLED: "1"
          V88_2_LONG_FEATURE_TRANSLATION_GUARD_ENABLED: "1"
          V86_7_PENDING_TRUTH_FIX_ENABLED: "1"
          V86_7_STRICT_TRUE_REPORT_PENDING_ENABLED: "1"
          V86_6_MEDIA_GUARD_ENABLED: "1"
          V86_6_FUTURE_SPEC_CAP_ENABLED: "1"
          V86_2_REPORT_MORNING_HOLD_ENABLED: "1"
          V89_2_SOURCE_CONSOLIDATED: "1"
          V90_0_OBSERVABILITY_ENABLED: "1"
          V90_1_QUALITY_ENABLED: "1"
          V90_1_REPORT_TITLE_HARDCODE_ENABLED: "1"
          V90_1_MEDIA_TAIL_GUARD_ENABLED: "1"
          V90_1_BOILERPLATE_SANITIZER_ENABLED: "1"
          V90_1_NUMERIC_TITLE_GUARD_ENABLED: "1"
          V90_1_TOPIC_DEDUPE_ENABLED: "1"
          V90_1_STALE_SPOILER_FIX_ENABLED: "1"
          V90_1_1_ENABLED: "1"
          V90_1_1_MEDIA_QUEUE_DEDUPE_ENABLED: "1"
          V90_1_1_REPORT_SHOW_STRICT_TITLE_ENABLED: "1"
          V90_1_1_PRE_REPORT_SPOILER_ENABLED: "1"
        run: |
          set +e
          python bot.py
          status=$?
          echo "$status" > .bot_exit_code
          exit 0

      - name: Collect v90.0 metrics
        if: always()
        run: |
          set +e
          python scripts/collect_v90_metrics.py
          exit 0

      - name: Sanitize artifact filenames
        if: always()
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          roots = [Path('published'), Path('published_html_review'), Path('logs')]
          invalid = {':':'-', '"':'-', '<':'-', '>':'-', '|':'-', '*':'-', '?':'-'}
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*'), key=lambda p: len(p.parts), reverse=True):
                  if not path.exists():
                      continue
                  clean = path.name.replace('\r','').replace('\n','')
                  for old, new in invalid.items():
                      clean = clean.replace(old, new)
                  if clean != path.name:
                      target = path.with_name(clean)
                      i = 1
                      while target.exists():
                          target = path.with_name(f"{target.stem}_{i}{target.suffix}")
                          i += 1
                      path.rename(target)
                      print(f"[ARTIFACT SANITIZE v90.1.1] {path} -> {target}")
          PY

      - name: Persist bot artifacts to repository
        if: always()
        run: |
          set -e
          mkdir -p published published_html_review logs
          touch logs/.keep published/.keep published_html_review/.keep

          echo "[ARTIFACT PERSIST v90.1.1] Stato prima dello staging"
          git status --short --ignored logs published published_html_review pending_articles.json history.txt history.json confirmed_published_reports.json .bot_exit_code || true

          git add -A -- published published_html_review logs || true
          find published published_html_review logs -type f -print0 | xargs -0 -r git add -f --
          for p in pending_articles.json pending_queue.json history.txt history.json confirmed_published_reports.json review_bundle_latest.zip .bot_exit_code; do
            if [ -e "$p" ]; then
              git add -f -- "$p"
            fi
          done

          echo "[ARTIFACT PERSIST v90.1.1] Stato dopo lo staging"
          git status --short || true

          if git diff --cached --quiet; then
            echo "[ARTIFACT PERSIST v90.1.1] Nessuna modifica staged da committare"
          else
            git commit -m "chore(bot): persist v90.1.1 artifacts and logs [skip ci]"
            git push
            echo "[ARTIFACT PERSIST v90.1.1] Artifact, metrics, published e master log committati nel repository"
          fi

      - name: Upload bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owtv-bot-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            published/
            published_html_review/
            logs/
            pending_articles.json
            pending_queue.json
            history.txt
            history.json
            confirmed_published_reports.json
            review_bundle_latest.zip
            .bot_exit_code

      - name: Fail job if bot failed
        if: always()
        run: |
          code=0
          if [ -f .bot_exit_code ]; then
            code=$(cat .bot_exit_code)
          fi
          if [ "$code" != "0" ]; then
            echo "[BOT v90.1.1] Bot terminato con exit code $code"
            exit "$code"
          fi
