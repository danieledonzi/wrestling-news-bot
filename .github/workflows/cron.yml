name: OpenWrestlingTV Bot v92

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: read

env:
  BOT_ARTIFACT_PATHS: |
    logs/
    state/
    published/
    published_html_review/
    review_bundle_latest.zip
    .bot_exit_code

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply v92 report workshop
        run: |
          set -e
          python scripts/apply_v92_report_workshop.py

      - name: Verify v92 source
        run: |
          set -e
          python -m json.tool config/reports_v92.json >/dev/null
          python -m json.tool config/feeds_v92.json >/dev/null
          python -m json.tool config/categories_v92.json >/dev/null
          python -m py_compile bot_v92.py
          python - <<'PY'
          from pathlib import Path
          text = Path('bot_v92.py').read_text(encoding='utf-8')
          required = [
              'v92_0_2_report_workshop_publish',
              'run_report_pipeline',
              'run_news_pipeline',
              'build_report_title',
              'expected_day_after',
              'entry_mentions_report_date',
              'run_report_workshop',
              'MAX_REPORTS_PER_RUN',
              'MAX_NEWS_PER_RUN',
          ]
          missing = [m for m in required if m not in text]
          if missing:
              raise SystemExit('[V92 VERIFY] missing markers: ' + ', '.join(missing))
          print('[V92 VERIFY] bot_v92.py ok')
          PY

      - name: Run bot v92
        id: run_bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_URL: ${{ secrets.WP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-2.5-flash-lite,gemini-2.5-flash
          V92_MAX_REPORTS_PER_RUN: "1"
          V92_MAX_NEWS_PER_RUN: "3"
        run: |
          set +e
          python bot_v92.py
          status=$?
          echo "$status" > .bot_exit_code
          exit 0

      - name: Persist v92 runtime files
        if: always()
        run: |
          set -e
          git add -f logs/ state/ published/ published_html_review/ .bot_exit_code || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(v92): persist runtime state"
            git pull --rebase || echo "[v92] Warning: pull --rebase non riuscito, provo push diretto"
            git push || echo "[v92] Warning: push persistenza fallito"
          else
            echo "[v92] Nessun runtime file da persistere"
          fi

      - name: Upload bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owtv-v92-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/
            state/
            published/
            published_html_review/
            review_bundle_latest.zip
            .bot_exit_code

      - name: Fail job if bot failed
        if: always()
        run: |
          code=0
          if [ -f .bot_exit_code ]; then
            code=$(cat .bot_exit_code)
          fi
          if [ "$code" != "0" ]; then
            echo "[BOT v92] Bot terminato con exit code $code"
            exit "$code"
          fi
