name: OpenWrestlingTV Bot v90.2.5.4.1

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  BOT_ARTIFACT_PATHS: |
    published/
    published_html_review/
    logs/
    pending_articles.json
    history.txt
    history.json
    confirmed_published_reports.json
    review_bundle_latest.zip
    soft_pool.json
    v90_2_event_cores.json
    processed_urls.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply patches
        run: |
          set -e
          python scripts/apply_bot_patch_v90_1.py
          python scripts/apply_bot_patch_v90_1_review_fix.py
          python scripts/apply_bot_patch_v90_1_1.py
          python scripts/apply_bot_patch_v90_1_2.py
          python scripts/apply_bot_patch_v90_1_3.py
          python scripts/apply_bot_patch_v90_2.py
          python scripts/apply_bot_patch_v90_2_1.py
          python scripts/apply_bot_patch_v90_2_2.py
          python scripts/apply_bot_patch_v90_2_3.py
          python scripts/apply_bot_patch_v90_2_3_1.py
          python scripts/apply_bot_patch_v90_2_4.py
          python scripts/apply_bot_patch_v90_2_4_1.py
          python scripts/apply_bot_patch_v90_2_4_2.py
          python scripts/apply_bot_patch_v90_2_5.py
          python scripts/apply_bot_patch_v90_2_5_1.py
          python scripts/apply_bot_patch_v90_2_5_2.py
          python scripts/apply_bot_patch_v90_2_5_3.py
          python scripts/apply_bot_patch_v90_2_5_3_1.py
          python scripts/apply_bot_patch_v90_2_5_4.py
          python scripts/apply_bot_patch_v90_2_5_4_1.py

      - name: Verify consolidated source
        run: |
          set -e
          python -m json.tool config/event_registry.json >/dev/null
          python -m py_compile bot.py
          python - <<'PY'
          from pathlib import Path
          text = Path('bot.py').read_text(encoding='utf-8')
          required = [
              'v90.2.1: report dedupe protection',
              'v90.2.2: report flow tuning',
              'v90.2.3: social embed quote positioning',
              'v90.2.3.1: inline image dict normalization',
              'v90.2.4: offline pending hard-skip guard',
              'v90.2.4.1 report hard title',
              'v90.2.4.2 report casing guard',
              'v90.2.5 processed URL hard-skip',
              'v90.2.5.1 processed skip recorder',
              'v90.2.5.2 processed competitive guard',
              'v90.2.5.3 SNME event and publish processed guards',
              'v90.2.5.3.1 tighten SNME and publish guards',
              'v90.2.5.4 event registry',
              'v90.2.5.4.1 event registry report key',
          ]
          missing = [m for m in required if m not in text]
          if missing:
              raise SystemExit('[SOURCE CONSOLIDATION v90.2.5.4.1] missing markers: ' + ', '.join(missing))
          print('[SOURCE CONSOLIDATION v90.2.5.4.1] bot.py contiene la chain consolidata fino a v90.2.5.4.1')
          PY

      - name: Run bot v90_2_5_4_1
        id: run_bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_URL: ${{ secrets.WP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-2.5-flash-lite,gemini-2.5-flash
          V90_2_1_ENABLED: "1"
          V90_2_2_ENABLED: "1"
          V90_2_2_REPORT_NO_INLINE_IMAGES: "1"
          V90_2_2_POST_REPORT_UNSPOILER_ENABLED: "1"
          V90_2_2_TRANSLATE_REPORT_CHAIN: gemini-3-flash-preview,gemini-2.5-flash,gemini-3.1-flash-lite,gemini-2.5-pro
          V90_2_3_ENABLED: "1"
          V90_2_3_SOCIAL_QUOTE_ENABLED: "1"
          V90_2_4_ENABLED: "1"
          V90_2_4_OFFLINE_PENDING_GUARD_ENABLED: "1"
          V90_2_4_MIN_OFFLINE_PENDING_SCORE: "75"
          V90_2_4_MIN_OFFLINE_PENDING_FRESHNESS: "0.45"
          V90_2_5_ENABLED: "1"
          V90_2_5_PROCESSED_FILE: processed_urls.json
          V90_2_5_1_ENABLED: "1"
          V90_2_5_2_ENABLED: "1"
          V90_2_5_2_HIGH_SCORE_PROTECT: "85"
          V90_2_5_2_LOW_SCORE_FINAL_MAX: "54"
          V90_2_5_3_ENABLED: "1"
          V90_2_5_3_SNME_FLOOR: "82"
          V90_2_5_3_1_ENABLED: "1"
          V90_2_5_4_ENABLED: "1"
          V90_2_5_4_REGISTRY_PATH: config/event_registry.json
          V90_2_5_4_REPORT_FLOOR: "82"
          V90_2_5_4_HARD_NEWS_FLOOR: "85"
          V90_2_5_4_1_ENABLED: "1"
        run: |
          set +e
          python bot.py
          status=$?
          echo "$status" > .bot_exit_code
          exit 0

      - name: Persist runtime files
        if: always()
        run: bash scripts/persist_runtime_files.sh

      - name: Upload bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owtv-bot-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            published/
            published_html_review/
            logs/
            pending_articles.json
            history.txt
            history.json
            confirmed_published_reports.json
            review_bundle_latest.zip
            soft_pool.json
            v90_2_event_cores.json
            processed_urls.json
            .bot_exit_code

      - name: Fail job if bot failed
        if: always()
        run: |
          code=0
          if [ -f .bot_exit_code ]; then
            code=$(cat .bot_exit_code)
          fi
          if [ "$code" != "0" ]; then
            echo "[BOT v90.2.5.4.1] Bot terminato con exit code $code"
            exit "$code"
          fi
