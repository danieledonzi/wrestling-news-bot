name: OpenWrestlingTV Bot v87_3

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai

      - name: Run bot v87_3
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_URL: ${{ secrets.WP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-2.5-flash-lite
          V86_7_PENDING_TRUTH_FIX_ENABLED: "1"
          V86_7_STRICT_TRUE_REPORT_PENDING_ENABLED: "1"
          V86_6_MEDIA_GUARD_ENABLED: "1"
          V86_6_FUTURE_SPEC_CAP_ENABLED: "1"
          V86_2_REPORT_MORNING_HOLD_ENABLED: "1"
        run: |
          python bot.py

# v87_3: Gemini offline pending preservation and executive interview cap
