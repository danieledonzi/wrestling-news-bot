name: News Cron Bot v86.1

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 google-genai

      - name: Pre bot timestamp
        run: date -u

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-2.5-flash-lite
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
          WP_EDITORIALI_CATEGORY_ID: 13
          PUBLISHED_HTML_REVIEW_ENABLED: "1"
          PUBLISHED_HTML_REVIEW_DIR: published_html_review
          REVIEW_BUNDLE_ENABLED: "1"
          REVIEW_BUNDLE_PATH: review_bundle_latest.zip
          REVIEW_PACKAGE_ENABLED: "0"
          V82_EDITORIAL_REALISM_ENABLED: "1"
          V82_AI_SMELL_REPAIR_ENABLED: "1"
          V82_TITLE_REPAIR_ENABLED: "1"
          V83_MODEL_ROUTING_ENABLED: "1"
          V83_HIGH_SCORE_THRESHOLD: "85"
          V83_LITE_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-2.5-flash-lite
          V83_STRONG_MODEL_CHAIN: gemini-2.5-flash,gemini-3.1-flash-lite,gemini-2.5-flash-lite
          V83_STORM_REPORT_MODEL_CHAIN: gemini-2.5-flash,gemini-3.1-flash-lite,gemini-2.5-flash-lite
          V83_STORM_LITE_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-2.5-flash-lite
          V83_MIN_EDITORIAL_WORD_RATIO: "0.70"
          V83_MIN_EDITORIAL_WORD_RATIO_LONG: "0.66"
          V84_PUBLISH_GUARD_ENABLED: "1"
          V84_MIN_FINAL_BODY_WORDS: "55"
          V84_MIN_FINAL_BODY_PARAGRAPHS: "2"
          V84_STRONG_OEMBED_EXTRACTION: "1"
          V84_IMAGE_FALLBACK_ENABLED: "1"
          V84_1_SKIP_PENDING_IF_HISTORY_ONLY: "1"
          V84_1_SKIP_IF_WP_URL_EXISTS: "1"
          V84_1_STORM_EARLY_SKIP_ENABLED: "1"
          V84_1_STORM_MIN_PROCESS_SCORE: "55"
          V84_1_STORM_MIN_PROCESS_SCORE_WWE: "55"
          V85_DRAFT_FIRST_ENABLED: "1"
          V85_REQUIRE_FEATURED_BEFORE_PUBLISH: "1"
          V85_MAX_TOTAL_PUBLISHED_PER_RUN: "5"
          V85_1_SPOILER_LOG_DEDUP_ENABLED: "1"
          V85_1_SKIP_OBSOLETE_PRESHOW_BEFORE_GEMINI: "1"
          V85_1_SKIP_OPINION_LOW_BEFORE_TRANSLATION: "1"
          V85_1_OPINION_REFINE_SKIP_THRESHOLD: "65"
          V85_1_MODEL_MAX_503_PER_ARTICLE: "2"
          V85_3_GLOBAL_SPOILER_GATE_ENABLED: "1"
          V85_4_SKIPPED_HISTORY_ENABLED: "1"
          V85_4_BOOT_DIAGNOSTICS_ENABLED: "1"
          V86_CONTEXTUAL_DEDUPE_ENABLED: "1"
          V86_HARD_EMBED_ENGINE_ENABLED: "1"
          V86_YOUTUBE_INLINE_AS_EMBED: "1"
          V86_1_STRICT_AAA_BOOST_ENABLED: "1"
          V86_1_CONTEXTUAL_SIGNATURE_ENABLED: "1"
          V86_1_REPORT_HISTORY_VERIFY_WP: "1"
          V86_1_POSTSHOW_PREVIEW_RESCUE_ENABLED: "1"
          V86_1_RELAX_BODY_META_VALIDATION: "1"
          V86_DISABLE_PRE_GEMINI_CORE_HISTORY_HARD_SKIP: "1"
          V86_DISABLE_V851_EARLY_CORE_HARD_SKIP: "1"
          SKIPPED_HISTORY_FILE: skipped_history.json
        run: python bot.py

      - name: Post bot timestamp
        if: always()
        run: date -u

      - name: Upload master log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-log
          path: logs/master_log.log
          if-no-files-found: warn

      - name: Upload cumulative review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-bundle-latest
          path: review_bundle_latest.zip
          if-no-files-found: warn

      - name: Save bot state, logs and review bundle
        if: always()
        run: |
          git config --global user.name "News Bot"
          git config --global user.email "bot@wrestlingnews.com"

          echo "STATUS BEFORE ADD:"
          git status --short

          git add -f history.txt

          [ -f pending_articles.json ] && git add -f pending_articles.json
          [ -f failed_articles.json ] && git add -f failed_articles.json
          [ -f skipped_history.json ] && git add -f skipped_history.json
          [ -f logs/master_log.log ] && git add -f logs/master_log.log
          [ -f logs/master_log_state.json ] && git add -f logs/master_log_state.json
          [ -d published_html_review ] && git add -f published_html_review
          [ -f review_bundle_latest.zip ] && git add -f review_bundle_latest.zip

          echo "STATUS AFTER ADD:"
          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "Update bot state, logs and review bundle [skip ci]"
            git fetch origin main
            git pull --rebase origin main || (git rebase --abort || true; echo "Rebase failed"; exit 1)
            git push origin main
          else
            echo "Nessuna modifica da salvare"
          fi
