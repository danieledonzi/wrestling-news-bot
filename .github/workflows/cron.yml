name: OpenWrestlingTV Bot v87_7

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

env:
  BOT_ARTIFACT_PATHS: |
    published/
    published_html_review/
    logs/
    pending_queue.json
    history.json
    confirmed_published_reports.json
    review_bundle_latest.zip

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai

      - name: Run bot v87_7
        id: run_bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_URL: ${{ secrets.WP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-2.5-flash-lite
          V877_ENABLE_GEMINI_3_FLASH_PREVIEW: "1"
          V877_FATAL_AUTH_ENABLED: "1"
          V877_REPORT_CONFIRM_CLEANUP_ENABLED: "1"
          V86_7_PENDING_TRUTH_FIX_ENABLED: "1"
          V86_7_STRICT_TRUE_REPORT_PENDING_ENABLED: "1"
          V86_6_MEDIA_GUARD_ENABLED: "1"
          V86_6_FUTURE_SPEC_CAP_ENABLED: "1"
          V86_2_REPORT_MORNING_HOLD_ENABLED: "1"
        run: |
          set +e
          python bot.py
          status=$?
          echo "$status" > .bot_exit_code
          exit 0

      - name: Sanitize artifact filenames
        if: always()
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          roots = [Path('published'), Path('published_html_review'), Path('logs')]
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*'), key=lambda p: len(p.parts), reverse=True):
                  if not path.exists():
                      continue
                  clean_name = path.name.replace(':', '-').replace('\\r', '').replace('\\n', '')
                  if clean_name != path.name:
                      target = path.with_name(clean_name)
                      i = 1
                      while target.exists():
                          target = path.with_name(f"{target.stem}_{i}{target.suffix}")
                          i += 1
                      path.rename(target)
                      print(f"[ARTIFACT SANITIZE v87.7] {path} -> {target}")
          PY

      - name: Persist bot artifacts to repository
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p published published_html_review logs
          touch logs/.keep published/.keep published_html_review/.keep
          git status --short --ignored logs published published_html_review || true
          git add -f published/ published_html_review/ logs/ pending_queue.json history.json confirmed_published_reports.json review_bundle_latest.zip .bot_exit_code 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "[ARTIFACT PERSIST v87.7] Nessuna modifica da committare"
          else
            git commit -m "chore(bot): persist published artifacts and logs [skip ci]"
            git push
            echo "[ARTIFACT PERSIST v87.7] Artifact e log committati nel repository"
          fi

      - name: Upload bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owtv-bot-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            published/
            published_html_review/
            logs/
            pending_queue.json
            history.json
            confirmed_published_reports.json
            review_bundle_latest.zip
            .bot_exit_code

      - name: Fail job if bot failed
        if: always()
        run: |
          code=0
          if [ -f .bot_exit_code ]; then
            code=$(cat .bot_exit_code)
          fi
          if [ "$code" != "0" ]; then
            echo "[BOT v87.7] Bot terminato con exit code $code"
            exit "$code"
          fi
