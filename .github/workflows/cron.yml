name: OpenWrestlingTV Bot v87_4

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installiamo google-generativeai che è la libreria corretta per il bot
          pip install requests feedparser beautifulsoup4 google-genai

      - name: Diagnostic - List Gemini Models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import google.generativeai as genai
          import os
          genai.configure(api_key=os.environ.get('GEMINI_API_KEY'))
          print('--- LISTA MODELLI DISPONIBILI ---')
          try:
              for m in genai.list_models():
                  if 'generateContent' in m.supported_generation_methods:
                      print(f'ID: {m.name} | Display: {m.display_name}')
          except Exception as e:
              print(f'Errore diagnostica: {e}')
          print('---------------------------------')
          "

      - name: Run bot v87_4
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_URL: ${{ secrets.WP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Ho aggiornato la catena per includere i modelli 3.1 e 2.5 stabili
          GEMINI_MODEL_CHAIN: gemini-3.1-flash-lite,gemini-2.5-flash
          V86_7_PENDING_TRUTH_FIX_ENABLED: "1"
          V86_7_STRICT_TRUE_REPORT_PENDING_ENABLED: "1"
          V86_6_MEDIA_GUARD_ENABLED: "1"
          V86_6_FUTURE_SPEC_CAP_ENABLED: "1"
          V86_2_REPORT_MORNING_HOLD_ENABLED: "1"
        run: |
          python bot.py

# v87_4: Fixed library dependencies and added model diagnostics
